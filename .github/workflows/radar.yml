name: Radar Odoo

on:
  schedule:
    # Tres pasadas al dia, todos los dias: 07:00, 12:00 y 18:00 en Madrid en
    # invierno (UTC+1). En verano llegan una hora mas tarde. GitHub puede
    # retrasar unos minutos cualquier cron.
    - cron: "0 6,11,17 * * *"
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write           # para el commit de mantenimiento de abajo
  models: read              # GitHub Models: el LLM gratuito que evalua ofertas

concurrency:
  group: radar-db            # comparte la base SQLite con el recolector
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # La base SQLite es lo que evita avisar dos veces de la misma oferta.
      # Se guarda en la cache de Actions entre ejecuciones.
      - name: Recuperar historial
        uses: actions/cache@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Ejecutar radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m radar.main

# Radar de ofertas Python/Odoo - github.com/sowDragnir/radar-odoo

      # GitHub apaga los workflows programados tras 60 dias sin actividad en el
      # repo. Si el ultimo commit tiene mas de 40 dias, deja uno vacio.
      - name: Mantener vivo el radar
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "radar-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "Mantener activo el radar"
            git push
          fi
