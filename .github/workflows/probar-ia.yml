name: Probar IA

# Prueba la evaluacion con LLM (GitHub Models) con dos ofertas de ejemplo.
on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m radar.ia
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
